<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인터넷 연결 확인 | 다잉클</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f8ff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#18181b}
  .card{max-width:320px;margin:24px;padding:28px;background:#fff;border-radius:24px;text-align:center;box-shadow:0 10px 30px rgba(29,51,132,.12)}
  img{width:64px;height:64px;border-radius:16px}
  h1{font-size:20px;margin:16px 0 8px}
  p{font-size:14px;color:#52525b;line-height:1.6;margin:0 0 20px}
  button{border:0;border-radius:14px;background:#2453eb;color:#fff;font-weight:700;font-size:15px;padding:12px 20px}
</style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="">
    <h1>인터넷이 끊겼어요 📶</h1>
    <p>연결되면 바로 이어서 공부할 수 있어요.<br>와이파이나 데이터를 확인해 주세요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
